<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Список товаров</h1>
<a data-th-href="@{/catalogue/products/create}">Создание нового товара</a>
<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Товар</th>
            <th>Детали</th>
        </tr>
    </thead>
    <tbody>
        <tr data-th-each="product : ${products}">
            <td data-th-text="${product.id.toString()}"></td>
            <td data-th-text="${product.title}"></td>
            <td> <a data-th-href="@{/catalogue/products/{productId}(productId=${product.id})}"
                    data-th-text="${product.details}"></a> </td>
        </tr>

    </tbody>
</table>

</body>
</html>
