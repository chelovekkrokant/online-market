spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogue
    username: admin
    password: admin
  flyway:
    schemas:
      - public
      - catalogue
  application:
    name: catalogue-service
  jpa:
    show-sql: true
  security:
    user:
      name: admin
      password: admin
      roles:
        - SERVICE
server:
  port: 8080
logging:
  level:
    sql: info