spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogue
    username: admin
    password: admin
  flyway:
    schemas:
      - public
      - catalogue
  application:
    name: catalogue-service
  jpa:
    show-sql: true
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: localhost:8082/realms/online-manager
        registration:
    user:
      name: admin
      password: '{noop}admin'
      roles:
        - SERVICE
server:
  port: 8080
logging:
  level:
    sql: info